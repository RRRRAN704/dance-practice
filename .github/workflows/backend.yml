# Backend CI/CD: test every change; on main, build the image, push it to GHCR and deploy it to EC2.
#
# Deploy uses no long-lived credentials:
#   - GitHub's OIDC token is exchanged for a short-lived AWS role (AWS_DEPLOY_ROLE_ARN), allowed only
#     from this repo's main branch and only to run commands on one instance through SSM.
#   - The server pulls the image with this job's GITHUB_TOKEN, which expires when the job ends.
#   - SSH stays closed to the internet; SSM's agent connects outbound to AWS.
name: Backend

on:
  push:
    branches: [main]
    paths: ["backend/**", ".github/workflows/backend.yml"]
  pull_request:
    paths: ["backend/**", ".github/workflows/backend.yml"]
  workflow_dispatch:

env:
  IMAGE: ghcr.io/rrrran704/dance-practice-api
  AWS_REGION: eu-west-2
  API_URL: https://dance-api.flowbiterp.site

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      # Testcontainers starts a real Postgres using the runner's Docker.
      - run: ./mvnw -B verify

  build:
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: backend
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest
          # Links the package to this repo, so this repo's GITHUB_TOKEN can pull it.
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    runs-on: ubuntu-latest
    concurrency: production   # never run two deploys at once
    permissions:
      contents: read
      packages: read
      id-token: write         # lets the job request a GitHub OIDC token for AWS
    steps:
      - uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy on EC2 via SSM
        env:
          INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
          TAG: ${{ github.sha }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # The script runs as root on the server. On a failed health check it rolls back to the previous tag.
          params=$(jq -n --arg tag "$TAG" --arg user "$GHCR_USER" --arg token "$GHCR_TOKEN" '{
            executionTimeout: ["600"],
            commands: [
              "set -eu",
              "cd /opt/dance-practice",
              "trap \"docker logout ghcr.io >/dev/null 2>&1 || true\" EXIT",
              "echo \($token | @sh) | docker login ghcr.io -u \($user | @sh) --password-stdin",
              "prev=$(sed -n \"s/^IMAGE_TAG=//p\" .env)",
              "sed -i \"s/^IMAGE_TAG=.*/IMAGE_TAG=\($tag)/\" .env",
              "docker compose -f docker-compose.prod.yml pull backend",
              "if ! docker compose -f docker-compose.prod.yml up -d --wait --wait-timeout 180 backend; then echo \"New version unhealthy, rolling back to $prev\"; docker compose -f docker-compose.prod.yml logs --tail 80 backend; sed -i \"s/^IMAGE_TAG=.*/IMAGE_TAG=$prev/\" .env; docker compose -f docker-compose.prod.yml up -d --wait backend; exit 1; fi",
              "docker image prune -af --filter until=168h >/dev/null",
              "echo \"Deployed \($tag)\""
            ]}')
          id=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --comment "deploy ${TAG::7}" \
            --parameters "$params" \
            --query Command.CommandId --output text)
          echo "SSM command $id"

          for i in $(seq 1 72); do
            sleep 5
            status=$(aws ssm get-command-invocation --command-id "$id" --instance-id "$INSTANCE_ID" \
              --query Status --output text 2>/dev/null || echo Pending)
            case "$status" in Pending|InProgress|Delayed) continue ;; *) break ;; esac
          done
          aws ssm get-command-invocation --command-id "$id" --instance-id "$INSTANCE_ID" \
            --query '[StandardOutputContent, StandardErrorContent]' --output text
          echo "Status: $status"
          [ "$status" = Success ]

      - name: Smoke test
        run: curl -fsS --retry 5 --retry-delay 3 "$API_URL/actuator/health"
