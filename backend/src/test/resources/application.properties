# Loaded alongside src/main/resources/application.yml (different file name, so it adds to it, and
# .properties wins over .yml). The integration tests sign up many users from 127.0.0.1, so lift the
# per-IP limits; RateLimitTests sets its own small ones.
app.rate-limit.login-per-ip.capacity=100000
app.rate-limit.register-per-ip.capacity=100000
app.rate-limit.refresh-per-ip.capacity=100000
