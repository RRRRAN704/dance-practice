spring:
  application:
    name: dance-practice-api
  datasource:
    # Defaults match docker-compose.yml; override with env vars in other environments.
    url: ${DB_URL:jdbc:postgresql://localhost:5433/dance_practice}
    username: ${DB_USERNAME:dance}
    password: ${DB_PASSWORD:dance}
  jpa:
    # Flyway owns the schema; Hibernate only checks that entities match it.
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    locations: classpath:db/migration

management:
  endpoints:
    web:
      exposure:
        include: health,info

app:
  jwt:
    # Dev-only default. Production must set JWT_SECRET (base64, >= 32 bytes: `openssl rand -base64 32`).
    secret: ${JWT_SECRET:ZGV2LW9ubHktc2VjcmV0LWNoYW5nZS1tZS1pbi1wcm9kdWN0aW9uLTEyMzQ1Ng==}
    access-token-ttl: 15m
    refresh-token-ttl: 30d
