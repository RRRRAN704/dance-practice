# Local development database. Port 5433 so it doesn't clash with a Homebrew Postgres on 5432.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: dance_practice
      POSTGRES_USER: dance
      POSTGRES_PASSWORD: dance
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dance -d dance_practice"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
